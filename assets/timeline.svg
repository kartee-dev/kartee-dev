<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" role="img" aria-label="부산대 1·2학년, 2025년 2월 입대, 2026년 8월 전역, 지금 부산 PRE-SOMA 팀장, 2027년 3월 3학년 복학">
  <style>
    text { font-family: Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; text-anchor: middle; fill: #fff; }
    .name { font-size: 24px; font-weight: 700; }
    .date { font-size: 20px; fill-opacity: .65; }
    .on { fill: #fb923c; fill-opacity: 1; }
    .pulse { fill: #fb923c; transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
    @keyframes pulse { from { transform: scale(1); opacity: .6; } to { transform: scale(2.6); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: 0; } }
  </style>

  <rect width="880" height="190" rx="16" fill="#0f172a"/>

  <text class="name" x="140" y="66">부산대 1·2학년</text>
  <text class="name" x="340" y="66">군 복무</text>
  <text class="name on" x="540" y="66">PRE-SOMA 팀장</text>
  <text class="name" x="740" y="66">3학년</text>

  <!-- 지나간 구간, 지금 구간, 아직 안 온 구간 -->
  <line x1="40" y1="106" x2="440" y2="106" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
  <line x1="440" y1="106" x2="640" y2="106" stroke="#fb923c" stroke-width="10"/>
  <line x1="652" y1="106" x2="840" y2="106" stroke="#334155" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 20"/>

  <circle cx="240" cy="106" r="11" fill="#0f172a" stroke="#fff" stroke-opacity=".65" stroke-width="4"/>
  <circle cx="440" cy="106" r="11" fill="#0f172a" stroke="#fb923c" stroke-width="4"/>
  <circle class="pulse" cx="540" cy="106" r="10"/>
  <circle cx="540" cy="106" r="10" fill="#fff"/>
  <circle cx="640" cy="106" r="11" fill="#0f172a" stroke="#fff" stroke-opacity=".65" stroke-width="4"/>

  <text class="date" x="240" y="158">2025.02 입대</text>
  <text class="date" x="440" y="158">2026.08 전역</text>
  <text class="date on" x="540" y="158">지금</text>
  <text class="date" x="640" y="158">2027.03 복학</text>
</svg>
